[project]
name = "project"
version = "0.1.0"
description = "Multi-agent research paper comparison assistant"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.5.2",
    "langchain-chroma>=1.1.0",
    "langchain-google-genai>=4.5.2",
    "langgraph>=1.2.24",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pymupdf>=2.1",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
]

[project.scripts]
project = "project:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
